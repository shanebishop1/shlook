<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>{{TITLE}}</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #15171c;
        --muted: #5c6270;
        --faint: #8b92a0;
        --line: #e6e8ee;
        --line2: #eef0f4;
        --panel: #f7f8fa;
        --accent: #2f5fe0;
        --accent-soft: #eaf0ff;
      }
      * {
        box-sizing: border-box;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        background: #fff;
        color: var(--ink);
        font:
          16px/1.65 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          system-ui,
          sans-serif;
      }
      main {
        max-width: 52rem;
        margin: 0 auto;
        padding: 3rem 1.4rem 7rem;
      }
      header.doc {
        margin: 0 0 2.4rem;
        padding-bottom: 1.2rem;
        border-bottom: 1px solid var(--line);
      }
      header.doc .eyebrow {
        font-size: 0.72rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--faint);
        margin-bottom: 0.6rem;
      }
      header.doc h1 {
        font-size: 2.05rem;
        line-height: 1.15;
        letter-spacing: -0.02em;
        margin: 0 0 0.5rem;
        font-weight: 680;
      }
      header.doc .meta {
        color: var(--muted);
        font-size: 0.88rem;
      }
      h2 {
        font-size: 1.32rem;
        line-height: 1.25;
        letter-spacing: -0.01em;
        margin: 3rem 0 0.9rem;
        padding-top: 0.2rem;
        font-weight: 660;
      }
      h3 {
        font-size: 1.04rem;
        margin: 2rem 0 0.5rem;
        font-weight: 640;
        color: var(--ink);
      }
      h4 {
        font-size: 0.95rem;
        margin: 1.6rem 0 0.4rem;
        font-weight: 640;
        color: var(--muted);
        letter-spacing: 0.01em;
      }
      h2 + * {
        margin-top: 0;
      }
      p {
        margin: 0.7rem 0;
      }
      a {
        color: var(--accent);
        text-decoration: none;
        border-bottom: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
      }
      a:hover {
        border-bottom-color: var(--accent);
      }
      strong {
        font-weight: 650;
      }
      ul,
      ol {
        margin: 0.7rem 0;
        padding-left: 1.35rem;
      }
      li {
        margin: 0.32rem 0;
      }
      li::marker {
        color: var(--faint);
      }
      ul ul,
      ol ol,
      ul ol,
      ol ul {
        margin: 0.25rem 0;
      }
      code {
        font:
          0.88em ui-monospace,
          "SF Mono",
          SFMono-Regular,
          Menlo,
          monospace;
        background: var(--panel);
        border: 1px solid var(--line2);
        border-radius: 5px;
        padding: 0.1em 0.35em;
      }
      pre {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 1rem 1.1rem;
        overflow: auto;
        font-size: 0.88rem;
        line-height: 1.55;
      }
      pre code {
        background: none;
        border: 0;
        padding: 0;
        font-size: 1em;
      }
      .table-scroll {
        margin: 1.3rem 0;
        border: 1px solid var(--line);
        border-radius: 10px;
        overflow: auto;
        max-height: 70vh;
      }
      table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
        font-size: 0.9rem;
        display: table;
      }
      thead th {
        position: sticky;
        top: 0;
        z-index: 1;
        background: var(--panel);
        text-align: left;
        font-weight: 640;
        color: var(--ink);
        padding: 0.62rem 0.75rem;
        white-space: nowrap;
        box-shadow: inset 0 -1px 0 var(--line);
      }
      tbody td {
        padding: 0.6rem 0.75rem;
        border-bottom: 1px solid var(--line2);
        vertical-align: top;
      }
      tbody tr:last-child td {
        border-bottom: 0;
      }
      tbody tr:nth-child(even) td {
        background: #fcfcfd;
      }
      .ta-r {
        text-align: right;
      }
      .ta-c {
        text-align: center;
      }
      blockquote {
        margin: 1.3rem 0;
        padding: 0.7rem 1rem;
        border-left: 3px solid var(--accent-soft);
        background: var(--panel);
        border-radius: 0 8px 8px 0;
        color: var(--muted);
      }
      blockquote p {
        margin: 0.2rem 0;
      }
      hr {
        border: 0;
        border-top: 1px solid var(--line);
        margin: 2.6rem 0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --ink: #e9ebf0;
          --muted: #a2a8b6;
          --faint: #78808f;
          --line: #262a33;
          --line2: #1e222a;
          --panel: #12151b;
          --accent: #8fa8ff;
          --accent-soft: #1b2233;
        }
        body {
          background: #0b0c10;
        }
        tbody tr:nth-child(even) td {
          background: #0f1217;
        }
      }
      @media print {
        :root {
          color-scheme: light;
          --ink: #111;
          --muted: #444;
          --faint: #666;
          --line: #ccc;
          --line2: #e2e2e2;
          --panel: #f5f5f5;
          --accent: #1a3f9e;
          --accent-soft: #e8ecf7;
        }
        body {
          background: #fff;
        }
        main {
          max-width: none;
          padding: 0;
        }
        .table-scroll {
          max-height: none;
          overflow: visible;
        }
        thead th {
          position: static;
          box-shadow: none;
        }
        pre,
        blockquote,
        tr,
        li {
          break-inside: avoid;
        }
        a {
          color: inherit;
          border-bottom: 0;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header class="doc">
        <div class="eyebrow">{{EYEBROW}}</div>
        <h1>{{TITLE}}</h1>
        <div class="meta">{{DATE}}</div>
      </header>
      {{BODY}}
    </main>
  </body>
</html>
