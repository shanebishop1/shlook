name: Release npm Package

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

env:
  PACKAGE_ACCESS: public
  NPM_DIST_TAG: latest

jobs:
  verify-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.17.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify publishing toolchain
        run: |
          node --version
          npm --version
          npm_version="$(npm --version)"
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); if(a<11||(a===11&&(b<5||(b===5&&c<1)))) process.exit(1)' "$npm_version"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run repository quality gate
        run: pnpm run ci

      - name: Verify tag and package version
        run: |
          package_version="$(node -p 'require("./package.json").version')"
          test "${GITHUB_REF_NAME#v}" = "$package_version"

      - name: Inspect and create package tarball
        id: pack
        run: |
          npm pack --dry-run --json --ignore-scripts > "$RUNNER_TEMP/pack-dry-run.json"
          npm pack --json --ignore-scripts --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/pack.json"
          filename="$(node -p 'require(process.argv[1])[0].filename' "$RUNNER_TEMP/pack.json")"
          echo "filename=$filename" >> "$GITHUB_OUTPUT"

      - name: Smoke-test exact tarball
        run: |
          tarball="$RUNNER_TEMP/${{ steps.pack.outputs.filename }}"
          mkdir "$RUNNER_TEMP/package-smoke"
          npm install --prefix "$RUNNER_TEMP/package-smoke" --ignore-scripts --no-package-lock "$tarball"
          "$RUNNER_TEMP/package-smoke/node_modules/.bin/shlook" setup --plan --json > "$RUNNER_TEMP/setup-plan.json"
          node -e 'const value=require(process.argv[1]); if(!value.ok||value.command!=="setup") process.exit(1)' "$RUNNER_TEMP/setup-plan.json"

      - name: Retain verified tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package-${{ github.run_id }}
          path: ${{ runner.temp }}/${{ steps.pack.outputs.filename }}
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: verify-package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download verified tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package-${{ github.run_id }}
          path: ${{ runner.temp }}/npm-package

      - name: Publish exact tarball through OIDC
        run: |
          TARBALL="$(find "$RUNNER_TEMP/npm-package" -maxdepth 1 -name '*.tgz' -type f -print -quit)"
          test -n "$TARBALL"
          npm publish "$TARBALL" --ignore-scripts --access "$PACKAGE_ACCESS" --tag "$NPM_DIST_TAG"
